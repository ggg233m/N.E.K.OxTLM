plugins {
    id 'net.neoforged.moddev' version '2.0.95'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    maven { url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven { url = "https://maven.aliyun.com/repository/central" }
    maven { url = "https://maven.aliyun.com/repository/public" }
    maven { url = "https://maven.neoforged.net/releases"
        content {
            includeGroupByRegex "net\\.neoforged.*"
        }
    }
}

neoForge {
    version = project.neo_version

    // Expose Minecraft/NeoForge classes to src/test so the pure terrain
    // planner tests can use BlockPos without booting a game server.
    unitTest {
        enable()
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
            // Dev launches use exploded mod classes, so jarJar libraries are not unpacked.
            // Add only the embedded library here. Extending from runtimeClasspath also
            // puts the TLM mod jar on the plain classpath, bypassing mod discovery and
            // causing its Minecraft-dependent classes to load in the wrong module.
            additionalRuntimeClasspathConfiguration.dependencies.add(
                    project.dependencies.create("org.java-websocket:Java-WebSocket:1.5.4"))
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    implementation "maven.modrinth:touhou-little-maid:1.5.3-neoforge+mc1.21.1"
    implementation "org.java-websocket:Java-WebSocket:1.5.4"
    implementation "com.google.code.gson:gson:2.10.1"

    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"

    jarJar "org.java-websocket:Java-WebSocket:1.5.4"
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes([
                "Implementation-Title"  : project.name,
                "Implementation-Version": project.jar.archiveVersion,
        ])
    }
}
